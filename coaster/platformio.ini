; Hydrolet coaster: Seeed XIAO ESP32-C3.
; Wi-Fi to the cloud and BLE to the watch share the one radio on this chip,
; which is why NimBLE is used instead of the stock BLE stack — the stock one
; does not leave enough RAM for both.

[env:coaster]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; send_on_enter + echo: you see what you type, and it is sent as one line
; when you press Enter rather than keystroke by keystroke.
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes
monitor_eol = LF

; Wi-Fi + BLE + TLS together come to ~1.6 MB, which overflows the default
; 1.3 MB app slot. huge_app gives a single ~3 MB app instead of two OTA slots;
; the coaster is flashed over USB, so the second slot buys nothing.
board_build.partitions = huge_app.csv

; shared/ holds the BLE contract the watch is built against.
build_flags =
	-I ../shared

lib_deps =
	bogde/HX711@^0.7.5
	adafruit/Adafruit NeoPixel@^1.12.3
	bblanchon/ArduinoJson@^7.1.0
	; Must be 2.x. NimBLE 1.4 is built against Arduino core 2.x / IDF 4, and on
	; the core 3.x this board pulls it panics inside btdm_controller_init.
	h2zero/NimBLE-Arduino@^2.1.0
