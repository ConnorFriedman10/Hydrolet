; Hydrolet band: Seeed XIAO nRF52840 Sense.
; Acts as BLE peripheral. The coaster scans for HYDROLET_SERVICE_UUID,
; connects, and writes commands.

[env:band]
platform = nordicnrf52
board = adafruit_feather_nrf52840_sense
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

; shared/ holds the BLE contract the coaster is built against.
build_flags =
	-I ../shared

lib_deps =
	; Adafruit Bluefruit nRF52 is bundled with the board package, no external dep needed
